name: CI/CD MLOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Intégration Continue (CI) : Lint et Tests
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (black)
        run: black --check src tests

      - name: Run tests
        # On ignore test_api.py sur GitHub car le modèle .pkl n'y est pas
        run: pytest tests/ --ignore=tests/test_api.py --cov=src --cov-report=term-missing

  # 2. Déploiement Continu (CD) : Build de l'image Docker
  build-docker:
    needs: quality-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t impayes-api:${{ github.sha }} .

      # On ne lance pas le conteneur car il n'y a pas de modèle.pkl dans le repo GitHub
      # On vérifie juste que l'image se construit sans erreur.
