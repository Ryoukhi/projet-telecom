[project]
name = "mlops-impayes-telecom"
version = "0.1.0"
description = "MLOps pipeline for telecom unpaid bills prediction"
requires-python = ">=3.11,<3.12"
dependencies = [
    # ----- Data (versions exactes pour stopper le backtracking) -----
    "loguru>=0.7,<0.8",
    "pathspec<1.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "xgboost==2.0.3",
    "imbalanced-learn==0.12.4",

    # ----- MLOps -----
    "mlflow==2.15.0",
    "dvc==3.51.2",
    "prefect==2.19.9",
    "evidently==0.4.33",

    # ----- Serving -----
    "fastapi==0.114.2",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.8.2",

    # ----- Utils -----
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.4.10",
    "black==24.8.0",
    "pre-commit==3.8.0",
    "jupyter==1.1.1",
    "ipykernel==6.29.5",
]

[build-system]
requires = ["setuptools>=69,<70"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
