version: "3.9"

services:
  # 1. Le serveur MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: impayes-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_db:/mlflow_db
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow_db/mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000

  # 2. L'API FastAPI
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impayes-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      - mlflow
    # AJOUT : Vérifie que l'API répond bien avant de la déclarer "prête"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s # Laisse le temps au modèle de se charger

  # 3. L'interface Web Streamlit
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: impayes-streamlit
    ports:
      - "8501:8501"
    depends_on:
      api:
        # AJOUT : Attend que l'API soit "healthy" (pas juste démarrée)
        condition: service_healthy
